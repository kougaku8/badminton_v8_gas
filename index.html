          openCreateFailed: "イベント作成ページを開けません：",

        },
      };

      /* =====================================================
         当前语言
      ===================================================== */

      let currentLanguage = localStorage.getItem("language") || "zh";

      /* =====================================================
         获取当前语言文字
      ===================================================== */

      function t(key) {
        const language = I18N[currentLanguage] || I18N.zh;

        return language[key] !== undefined
          ? language[key]
          : I18N.zh[key] || key;
      }

      /* =====================================================
         切换语言
      ===================================================== */

      function setLanguage(lang) {
        if (!I18N[lang]) {
          lang = "zh";
        }

        currentLanguage = lang;

        localStorage.setItem("language", lang);

        applyLanguage();

        /*
         * 重新显示活动列表
         *
         * 这样「进入活动」
         * 会立即变成日语 / 中文
         */

        if (typeof allActivities !== "undefined") {
          renderActivities(allActivities);
        }
      }

      /* =====================================================
         应用语言
      ===================================================== */

      function applyLanguage() {
        const dictionary = I18N[currentLanguage] || I18N.zh;

        /* =========================
           普通文字
        ========================= */

        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          const key = el.getAttribute("data-i18n");

          if (dictionary[key] !== undefined) {
            el.textContent = dictionary[key];
          }
        });

        /* =========================
           placeholder
        ========================= */

        document
          .querySelectorAll("[data-i18n-placeholder]")
          .forEach(function (el) {
            const key = el.getAttribute("data-i18n-placeholder");

            if (dictionary[key] !== undefined) {
              el.placeholder = dictionary[key];
            }
          });

        /* =========================
           更新语言按钮
        ========================= */

        const zhButton = document.getElementById("langZh");

        const jaButton = document.getElementById("langJa");

        if (zhButton) {
          zhButton.classList.toggle("active", currentLanguage === "zh");
        }

        if (jaButton) {
          jaButton.classList.toggle("active", currentLanguage === "ja");
        }

        /* =========================
           动态文字
        ========================= */

        updateDynamicLanguage();
      }

      /* =====================================================
         动态文字
      ===================================================== */

      function updateDynamicLanguage() {
        const loading = document.querySelector("#activityList .empty-card");

        if (
          loading &&
          (loading.textContent.includes("加载") ||
            loading.textContent.includes("読み込"))
        ) {
          loading.textContent = t("loadingActivities");
        }
      }

      /* =====================================================
         管理员登录状态
      =====================================================

         登录成功后保存 8 小时。

         注意：

         这里只保存：
         loggedIn
         expiresAt

         不保存管理员密码。
      ===================================================== */

      const ADMIN_LOGIN_KEY = "badminton_admin_login";

      const ADMIN_LOGIN_EXPIRE = 8 * 60 * 60 * 1000;

      /*
       * 防止连续点击确认
       */

      let adminLoginProcessing = false;

      /* =====================================================
         保存管理员登录状态
      ===================================================== */

      function saveAdminLoginState() {
        const data = {
          loggedIn: true,

          expiresAt: Date.now() + ADMIN_LOGIN_EXPIRE,
        };

        localStorage.setItem(
          ADMIN_LOGIN_KEY,

          JSON.stringify(data),
        );
      }

      /* =====================================================
         检查管理员登录状态
      ===================================================== */

      function isAdminLoggedIn() {
        try {
          const raw = localStorage.getItem(ADMIN_LOGIN_KEY);

          if (!raw) {
            return false;
          }

          const data = JSON.parse(raw);

          if (!data.loggedIn) {
            return false;
          }

          /*
           * 检查是否过期
           */

          if (!data.expiresAt || Date.now() >= data.expiresAt) {
            localStorage.removeItem(ADMIN_LOGIN_KEY);

            return false;
          }

          return true;
        } catch (error) {
          console.error("读取管理员登录状态失败:", error);

          localStorage.removeItem(ADMIN_LOGIN_KEY);

          return false;
        }
      }

      /* =====================================================
         显示管理员 Panel
      ===================================================== */

      function showAdminPanel() {
        const loginArea = document.getElementById("adminLoginArea");

        const adminPanel = document.getElementById("adminPanel");

        if (loginArea) {
          loginArea.style.display = "none";
        }

        if (adminPanel) {
          adminPanel.style.display = "block";
        }
      }

      /* =====================================================
         显示管理员登录
      ===================================================== */

      function showAdminLogin() {
        /*
         * 如果已经登录
         *
         * 直接显示管理员功能，
         * 不再要求密码。
         */

        if (isAdminLoggedIn()) {
          showAdminPanel();

          return;
        }

        const overlay = document.getElementById("adminLoginOverlay");

        const password = document.getElementById("adminPassword");

        const error = document.getElementById("adminLoginError");

        password.value = "";

        error.textContent = t("passwordWrong");

        error.style.display = "none";

        overlay.style.display = "flex";

        adminLoginProcessing = false;

        setTimeout(function () {
          password.focus();
        }, 100);
      }

      /* =====================================================
         关闭管理员登录
      ===================================================== */

      function closeAdminLogin() {
        const overlay = document.getElementById("adminLoginOverlay");

        if (overlay) {
          overlay.style.display = "none";
        }

        adminLoginProcessing = false;
      }

      /* =====================================================
         管理员密码验证
      ===================================================== */

      function loginAdmin() {
        /*
         * 防止连续点击
         */

        if (adminLoginProcessing) {
          return;
        }

        const password = document.getElementById("adminPassword");

        const error = document.getElementById("adminLoginError");

        const confirmButton = document.querySelector(".admin-login-confirm");

        const pwd = password.value.trim();

        /* =========================
           密码为空
        ========================= */

        if (!pwd) {
          error.textContent = t("passwordRequired");

          error.style.display = "block";

          password.focus();

          return;
        }

        /* =========================
           开始验证
        ========================= */

        adminLoginProcessing = true;

        error.style.display = "none";

        /*
         * 禁用确认按钮
         */

        if (confirmButton) {
          confirmButton.disabled = true;

          confirmButton.style.opacity = "0.6";

          confirmButton.textContent =
            currentLanguage === "ja" ? "確認中..." : "验证中...";
        }

        /* =========================
           调用 GAS
        ========================= */

        google.script.run

          .withSuccessHandler(function (success) {
            adminLoginProcessing = false;

            /*
             * 恢复按钮
             */

            if (confirmButton) {
              confirmButton.disabled = false;

              confirmButton.style.opacity = "1";

              confirmButton.textContent = t("confirm");
            }

            /* =====================
                 登录成功
              ===================== */

            if (success) {
              /*
               * 保存 8 小时状态
               */

              saveAdminLoginState();

              /*
               * 清除密码
               */

              password.value = "";

              /*
               * 关闭登录窗口
               */

              closeAdminLogin();

              /*
               * 显示管理员功能
               */

              showAdminPanel();

              return;
            }

            /* =====================
                 密码错误
              ===================== */

            error.textContent = t("passwordWrong");

            error.style.display = "block";

            /*
             * 密码错误后清空
             */

            password.value = "";

            password.focus();
          })

          .withFailureHandler(function (err) {
            adminLoginProcessing = false;

            /*
             * 恢复按钮
             */

            if (confirmButton) {
              confirmButton.disabled = false;

              confirmButton.style.opacity = "1";

              confirmButton.textContent = t("confirm");
            }

            error.textContent =
              t("loginFailed") +
              (err && err.message ? err.message : String(err));

            error.style.display = "block";
          })

          .checkAdminPassword(pwd);
      }

      /* =====================================================
         退出管理员
      ===================================================== */

      function logoutAdmin() {
        /*
         * 删除登录状态
         */

        localStorage.removeItem(ADMIN_LOGIN_KEY);

        const loginArea = document.getElementById("adminLoginArea");

        const adminPanel = document.getElementById("adminPanel");

        if (loginArea) {
          loginArea.style.display = "block";
        }

        if (adminPanel) {
          adminPanel.style.display = "none";
        }

        const password = document.getElementById("adminPassword");

        if (password) {
          password.value = "";
        }
      }

      /* =====================================================
         页面加载时恢复管理员登录状态
      ===================================================== */

      function restoreAdminLogin() {
        if (isAdminLoggedIn()) {
          console.log("管理员登录状态有效，无需重新输入密码");

          showAdminPanel();
        } else {
          console.log("管理员登录状态不存在或已过期");
        }
      }

      /* =====================================================
         页面初始化
      ===================================================== */

      window.addEventListener("DOMContentLoaded", function () {
        applyLanguage();

        /*
         * 恢复管理员登录状态
         */

        restoreAdminLogin();
      });

      /* =====================================================
         回车提交管理员密码
      ===================================================== */

      document.addEventListener("keydown", function (event) {
        const overlay = document.getElementById("adminLoginOverlay");

        if (
          event.key === "Enter" &&
          overlay &&
          overlay.style.display === "flex"
        ) {
          event.preventDefault();

          loginAdmin();
        }
      });

      /* =====================================================
         签到页面
         手机 / 电脑统一使用 Web App URL
      ===================================================== */

      function openCheckin() {
        console.log("正在打开签到页面...");

        google.script.run

          .withSuccessHandler(function (url) {
            console.log("获取 Web App URL:", url);

            if (!url) {
              alert(t("openCheckinFailed"));

              return;
            }

            const targetUrl = url + "?page=checkin";

            console.log("签到页面:", targetUrl);

            window.top.location.href = targetUrl;
          })

          .withFailureHandler(function (error) {
            console.error("打开签到页面失败:", error);

            alert(
              t("openCheckinFailed") +
                (error && error.message ? error.message : String(error)),
            );
          })

          .getWebAppUrl();
      }

      /* =====================================================
         我的报名
      ===================================================== */

      function openMyRegistration() {
        console.log("正在打开我的报名...");

        google.script.run

          .withSuccessHandler(function (url) {
            console.log("获取 Web App URL:", url);

            if (!url) {
              alert(
                currentLanguage === "ja"
                  ? "WebアプリのURLを取得できませんでした"
                  : "无法获取 Web App URL",
              );

              return;
            }

            const targetUrl = url + "?page=myRegistration";

            console.log("我的报名页面:", targetUrl);

            window.top.location.href = targetUrl;
          })

          .withFailureHandler(function (error) {
            console.error("打开我的报名失败:", error);

            alert(
              currentLanguage === "ja"
                ? "申込み履歴ページを開けませんでした：" +
                    (error && error.message ? error.message : String(error))
                : "无法打开我的报名：" +
                    (error && error.message ? error.message : String(error)),
            );
          })

          .getWebAppUrl();
      }

      /* =====================================================
         创建活动
      ===================================================== */

      function openCreateActivity() {
        google.script.run

          .withSuccessHandler(function (url) {
            if (!url) {
              alert(t("openCreateFailed"));

              return;
            }

            window.top.location.href = url + "?page=createActivity";
          })

          .withFailureHandler(function (error) {
            console.error("获取 Web App URL 失败:", error);

      /* =====================================================
         FCM 通知入口
      ===================================================== */

      function enableNotification() {
        const url = "https://kougaku8.github.io/badminton-icon/?fcm=1";

        window.top.location.href = url;
      }

      /* =====================================================
         Firebase FCM
      ===================================================== */

      const firebaseConfig = {
        apiKey: "AIzaSyD6DUuQto_5BYZJDgkaI8CBGaOQkXMgrCk",

        authDomain: "badminton-notification.firebaseapp.com",

        projectId: "badminton-notification",

        storageBucket: "badminton-notification.firebasestorage.app",

        messagingSenderId: "419794096766",

        appId: "1:419794096766:web:9dd990fe827719d149fe2f",
      };

      /* =====================================================
         初始化 Firebase
      ===================================================== */

      firebase.initializeApp(firebaseConfig);

      const messaging = firebase.messaging();

      /* =====================================================
         注册 FCM
      ===================================================== */

      async function initFCM() {
        try {
          console.log("开始初始化 FCM...");

          /* =========================
             1. 请求通知权限
          ========================= */

          const permission = await Notification.requestPermission();

          console.log("通知权限:", permission);

          if (permission !== "granted") {
            console.log("用户没有允许通知");

            return;
          }

          /* =========================
             2. 获取 FCM Token
          ========================= */

          const token = await messaging.getToken({
            vapidKey:
              "BEzm7tEPH4F7nr5saymZsJqdnF_h_DlTZWgXsN6cDOjb4VVJIGseCnJLPwW37ko_uulqKjhPtjlg-9kYHjTzSJI",
          });

          if (!token) {
            console.error("没有取得 FCM Token");

            return;
          }

          console.log("FCM Token:", token);

          /* =========================
             3. 发送 Token 到 GAS
          ========================= */

          google.script.run

            .withSuccessHandler(function (result) {
              console.log("FCM Token 保存成功:", result);
            })

            .withFailureHandler(function (error) {
              console.error("FCM Token 保存失败:", error);
            })

            .saveAdminFCMToken(token);
        } catch (error) {
          console.error("FCM 初始化失败:", error);
        }
      }

      /* =====================================================
         页面加载后启动 FCM
      ===================================================== */

      window.addEventListener("load", function () {
        initFCM();
      });

      /* =====================================================
         前台收到通知
      ===================================================== */

      messaging.onMessage(function (payload) {
        console.log("收到前台 FCM:", payload);

        const title =
          payload.notification && payload.notification.title
            ? payload.notification.title
            : "🏸 羽球活动";

        const body =
          payload.notification && payload.notification.body
            ? payload.notification.body
            : "新しい通知があります";

        /*
         * 前台时浏览器通常不会自动显示通知，
         * 所以这里手动显示。
         */

        if (Notification.permission === "granted") {
          new Notification(title, {
            body: body,

            icon: "https://kougaku8.github.io/badminton-icon/heian-bado-yoyaku-icon_512.png",
          });
        }
      });
